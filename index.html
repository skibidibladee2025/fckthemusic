<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FCKTHEMUSIC">
<meta name="theme-color" content="#0a0a0a">
<title>FCKTHEMUSIC</title>
<link rel="manifest" data-manifest='{"name":"FCKTHEMUSIC","short_name":"FCKTHEMUSIC","start_url":".","display":"standalone","background_color":"#0a0a0a","theme_color":"#0a0a0a","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>","sizes":"any","type":"image/svg+xml"}]}'>
<style>
:root {
  --bg: #0a0a0a;
  --fg: #fafafa;
  --muted: #71717a;
  --accent: #ff2d55;
  --accent-dim: #ff2d5533;
  --card: #141414;
  --border: #27272a;
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; border: none; background: none; cursor: pointer; }
input { font: inherit; border: none; outline: none; background: transparent; color: inherit; }
ul { list-style: none; }

/* Layout */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Header */
.header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Search */
.search-wrap {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.search-form {
  display: flex;
  gap: 8px;
}
.search-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  font-size: 17px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.search-input::placeholder { color: var(--muted); }
.search-btn {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: transform 0.1s, background 0.2s;
}
.search-btn:active { transform: scale(0.96); background: #e02448; }
.search-btn:disabled { opacity: 0.5; }

/* Results */
.results {
  flex: 1;
  padding: 0 20px 20px;
  overflow-y: auto;
}
.results-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 12px;
  padding-left: 4px;
}
.track-list { display: flex; flex-direction: column; gap: 10px; }

/* Track Card */
.track {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s, transform 0.1s;
}
.track:active { transform: scale(0.99); border-color: var(--accent); }
.track-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
}
.track-art {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.track-info { flex: 1; min-width: 0; }
.track-title {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}
.track-source {
  background: var(--accent-dim);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
}
.track-duration { font-variant-numeric: tabular-nums; }
.track-size { font-variant-numeric: tabular-nums; }
.track-btn {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  transition: transform 0.1s, background 0.2s;
}
.track-btn:active { transform: scale(0.92); background: #e02448; }
.track-btn:disabled { opacity: 0.4; }
.track-btn.downloading { background: #3b82f6; }
.track-btn.done { background: #22c55e; }

/* Empty/Loading/Error States */
.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}
.state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.state-title { font-size: 17px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
.state-desc { font-size: 14px; max-width: 280px; }

.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.success { border-color: #22c55e; }
.toast.error { border-color: #ef4444; }
.toast-icon { font-size: 20px; }
.toast.success .toast-icon { color: #22c55e; }
.toast.error .toast-icon { color: #ef4444; }

/* Install Banner */
.install-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transform: translateY(100%);
  transition: transform 0.3s;
  z-index: 50;
}
.install-banner.show { transform: translateY(0); }
.install-text { font-size: 14px; color: var(--fg); }
.install-text strong { color: var(--accent); }
.install-btn {
  background: var(--accent);
  color: white;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
}
.install-close { color: var(--muted); font-size: 20px; }

/* Footer */
.footer {
  padding: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--border);
}
.footer a { color: var(--muted); }
.footer a:hover { color: var(--accent); }

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Landscape Phone */
@media (max-height: 500px) and (orientation: landscape) {
  .header { padding: 10px 16px; }
  .search-wrap { padding: 12px 16px; }
  .search-input { padding: 12px 14px; font-size: 16px; }
  .search-btn { width: 48px; height: 48px; }
  .track-inner { padding: 10px 12px; }
  .track-art { width: 48px; height: 48px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">FCKTHEMUSIC</div>
  </header>

  <main class="search-wrap">
    <form class="search-form" id="searchForm">
      <input type="search" class="search-input" id="query" placeholder="Search song, artist, lyrics..." autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" required>
      <button type="submit" class="search-btn" id="searchBtn" aria-label="Search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>

    <section class="results" id="results" aria-live="polite">
      <div class="state" id="emptyState">
        <div class="state-icon">🎵</div>
        <div class="state-title">Search for music</div>
        <div class="state-desc">Type a song, artist, or lyrics above to find tracks</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    Powered by <a href="https://mp3juice.sc" target="_blank" rel="noopener">mp3juice.sc</a> ·
    <a href="https://github.com" target="_blank" rel="noopener">Open Source</a>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-icon" id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<div class="install-banner" id="installBanner" role="dialog" aria-label="Install app">
  <span class="install-text">Install <strong>FCKTHEMUSIC</strong> for instant access</span>
  <button class="install-btn" id="installBtn">Install</button>
  <button class="install-close" id="installClose" aria-label="Dismiss">×</button>
</div>

<script>
// ===== CONFIG =====
const API_BASE = ''; // Same origin - replace with your API URL if different
const STORAGE_KEY = 'fckthemusic_queries';

// ===== STATE =====
let deferredPrompt = null;
let recentQueries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

// ===== DOM =====
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const searchForm = $('#searchForm');
const queryInput = $('#query');
const searchBtn = $('#searchBtn');
const resultsEl = $('#results');
const emptyState = $('#emptyState');
const toast = $('#toast');
const toastIcon = $('#toastIcon');
const toastMsg = $('#toastMsg');
const installBanner = $('#installBanner');
const installBtn = $('#installBtn');
const installClose = $('#installClose');

// ===== UTILS =====
function showToast(msg, type = 'info') {
  toastIcon.textContent = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  toastMsg.textContent = msg;
  toast.className = 'toast show ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function formatDuration(sec) {
  if (!sec) return '--:--';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function saveQuery(q) {
  recentQueries = [q, ...recentQueries.filter(x => x !== q)].slice(0, 10);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recentQueries));
}

// ===== RENDER =====
function renderTracks(tracks) {
  if (!tracks.length) {
    resultsEl.innerHTML = `
      <div class="state">
        <div class="state-icon">🔍</div>
        <div class="state-title">No results</div>
        <div class="state-desc">Try different keywords or check spelling</div>
      </div>`;
    return;
  }
  resultsEl.innerHTML = `
    <div class="results-title">${tracks.length} result${tracks.length !== 1 ? 's' : ''}</div>
    <ul class="track-list" role="list">
      ${tracks.map((t, i) => `
        <li class="track" data-index="${i}">
          <div class="track-inner">
            <div class="track-art" aria-hidden="true">🎵</div>
            <div class="track-info">
              <div class="track-title">${escapeHtml(t.title)}</div>
              <div class="track-meta">
                <span class="track-source">${escapeHtml(t.source)}</span>
                <span class="track-duration">${escapeHtml(t.duration)}</span>
                <span class="track-size">${escapeHtml(t.size_mb)}</span>
              </div>
            </div>
            <button class="track-btn" data-index="${i}" aria-label="Download ${escapeHtml(t.title)}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
          </div>
        </li>
      `).join('')}
    </ul>`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
}

// ===== SEARCH =====
async function search(query) {
  searchBtn.disabled = true;
  resultsEl.innerHTML = '<div class="state"><div class="spinner"></div><div class="state-title">Searching...</div></div>';
  emptyState.style.display = 'none';

  try {
    const res = await fetch(API_BASE + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, max_results: 15 })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderTracks(data.results || []);
    saveQuery(query);
  } catch (e) {
    console.error(e);
    resultsEl.innerHTML = `
      <div class="state">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Search failed</div>
        <div class="state-desc">${e.message}. Check console or try again.</div>
      </div>`;
  } finally {
    searchBtn.disabled = false;
  }
}

// ===== DOWNLOAD =====
async function downloadTrack(track, btn) {
  const originalHtml = btn.innerHTML;
  btn.classList.add('downloading');
  btn.disabled = true;
  btn.innerHTML = '<svg class="spinner" style="width:20px;height:20px;border-width:2px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg>';

  try {
    const url = `${API_BASE}/download?url=${encodeURIComponent(track.download_url)}&filename=${encodeURIComponent(track.title)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const blob = await res.blob();
    const filename = `${track.title.replace(/[<>:"/\\|?*]/g, '_')}.mp3`;

    // Try File System Access API (modern browsers)
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'MP3 Audio', accept: { 'audio/mpeg': ['.mp3'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        showToast('Saved to Files', 'success');
        btn.classList.remove('downloading');
        btn.classList.add('done');
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = originalHtml; btn.disabled = false; }, 2000);
        return;
      } catch (e) {
        if (e.name !== 'AbortError') console.warn('File picker failed:', e);
      }
    }

    // Fallback: anchor download
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);

    showToast('Download started', 'success');
    btn.classList.remove('downloading');
    btn.classList.add('done');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = originalHtml; btn.disabled = false; }, 2000);
  } catch (e) {
    console.error(e);
    showToast(`Download failed: ${e.message}`, 'error');
    btn.classList.remove('downloading');
    btn.innerHTML = originalHtml;
    btn.disabled = false;
  }
}

// ===== EVENTS =====
searchForm.addEventListener('submit', e => {
  e.preventDefault();
  const q = queryInput.value.trim();
  if (q) search(q);
});

resultsEl.addEventListener('click', e => {
  const btn = e.target.closest('.track-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.index, 10);
  const tracks = Array.from(resultsEl.querySelectorAll('.track')).map((el, i) => ({
    title: el.querySelector('.track-title').textContent,
    source: el.querySelector('.track-source').textContent,
    duration: el.querySelector('.track-duration').textContent,
    size_mb: el.querySelector('.track-size').textContent,
    download_url: '' // We'll need to store this
  }));
  // Better: store download URLs in data attribute
  const trackEl = btn.closest('.track');
  const downloadUrl = trackEl.dataset.downloadUrl;
  if (downloadUrl) {
    const track = {
      title: trackEl.querySelector('.track-title').textContent,
      download_url: downloadUrl
    };
    downloadTrack(track, btn);
  }
});

// Store download URLs on track elements after render
function storeDownloadUrls(tracks) {
  $$('.track').forEach((el, i) => {
    if (tracks[i]) el.dataset.downloadUrl = tracks[i].download_url;
  });
}

// Patch renderTracks to store URLs
const origRender = renderTracks;
renderTracks = (tracks) => {
  origRender(tracks);
  storeDownloadUrls(tracks);
};

// ===== PWA INSTALL =====
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => installBanner.classList.add('show'), 10000);
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    installBanner.classList.remove('show');
    deferredPrompt = null;
  }
});

installClose.addEventListener('click', () => {
  installBanner.classList.remove('show');
});

// Hide install banner on iOS (not supported)
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  installBanner.style.display = 'none';
}

// ===== INIT =====
queryInput.focus();

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== queryInput) {
    e.preventDefault();
    queryInput.focus();
  }
});

// Prevent zoom on input focus (iOS)
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  const viewport = document.querySelector('meta[name=viewport]');
  viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
}
</script>
</body>
</html>
